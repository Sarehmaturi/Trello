<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trello Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container kanban-board">
        <div class="column todo box">
            <h2>📝 To Do</h2>
            <div class="task" draggable="true">📌Task 1</div>
            <div class="task" draggable="true">📌Task 2</div>
        </div>

        <div class="column doing box">
            <h2>🚧 Doing</h2>
            <div class="task" draggable="true">⏳Task 3</div>
        </div>

        <div class="column done box">
            <h2>✅ Done</h2>
            <div class="task" draggable="true">🎉Task 4</div>
        </div>
    </div>

</body>
<script src="./script.js"></script>
</html>
